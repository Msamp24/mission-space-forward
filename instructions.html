<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mission SPACE Forward</title>
  <style>
    :root {
      --bg: #f5f3ef;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #6b6b6b;
      --accent: #4a5a6a;
      --on-accent: #ffffff;
      --line: #e4e0d8;
      --soft: #f0ede7;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-size: 18px;
    }
    main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; }
    header { text-align: center; margin-bottom: 28px; }
    .badge {
      display: inline-block; font-size: 13px; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted);
      border: 1px solid var(--line); background: var(--card);
      border-radius: 999px; padding: 4px 14px;
    }
    h1 { font-size: 2.4rem; margin: 14px 0 8px; line-height: 1.2; }
    .tagline { color: var(--muted); margin: 0; }
    .space {
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
      margin: 0 0 24px;
    }
    .space div {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 10px 4px;
      text-align: center; font-size: 13px; color: var(--muted);
    }
    .space b { display: block; font-size: 1.5rem; color: var(--accent); line-height: 1.2; }
    .links { display: flex; flex-direction: column; gap: 14px; }
    a.card {
      display: block; text-decoration: none; color: var(--text);
      background: var(--card); border: 1px solid var(--line);
      border-radius: 16px; padding: 20px 22px;
    }
    a.card:hover { border-color: var(--accent); }
    a.card strong { display: block; font-size: 1.2rem; color: var(--accent); }
    a.card span { color: var(--muted); font-size: 16px; }
    a.primary { background: var(--accent); border-color: var(--accent); }
    a.primary strong, a.primary span { color: var(--on-accent); }
    footer { text-align: center; color: var(--muted); font-size: 15px; margin-top: 32px; }
    @media (max-width: 420px) { .space div { font-size: 11px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Mission SPACE Forward</h1>
    </header>
  </main>
</body>
</html>
